<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faultline</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #05060a; }

      /* Money-shot reveal (section 9 step 3): the final collapsed price
         pulses in rather than just appearing at a bigger font size. */
      @keyframes money-shot-pulse {
        0%   { transform: scale(0.92); }
        45%  { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .money-shot-price {
        animation: money-shot-pulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
